spring:
  application:
    name: cardex-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

tcgdex:
  base-url: https://api.tcgdex.net/v2/en

exchange-rate:
  base-url: https://economia.awesomeapi.com.br
  cache-minutes: 360

cardex:
  security:
    jwt:
      secret: carddex-super-secret-development-key-2026
      expiration-minutes: 120
